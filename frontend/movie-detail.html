<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inception - NEXUS Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg custom-navbar fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="nexus-logo">NEXUS</span>
                <span class="text-light fs-6 ms-2">Movies</span>
            </a>

            <div class="collapse navbar-collapse" id="navbarContent">
                <form class="d-flex mx-auto search-form">
                    <div class="input-group">
                        <span class="input-group-text search-icon-bg"><i class="bi bi-search text-secondary"></i></span>
                        <input class="form-control search-input" type="search" placeholder="Search movies...">
                    </div>
                </form>
                <ul class="navbar-nav ms-auto align-items-center flex-row justify-content-center gap-4 py-2">
                    <li class="nav-item"><a class="nav-link text-white nav-hover" href="index.html"><i class="bi bi-house-door me-1"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white nav-hover" href="favorites.html"><i class="bi bi-heart me-1"></i> Favorites</a></li>
                    <li class="nav-item"><a class="nav-link text-white nav-hover" href="#"><i class="bi bi-info-circle me-1"></i> About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="backdrop-container" id="backdropContainer">
        <div class="backdrop-overlay"></div>
        <button class="btn btn-back" onclick="window.history.back()"><i class="bi bi-arrow-left"></i> Back</button>
    </div>

    <div class="container content-wrapper mb-5">
        <div class="row gx-5">
            <div class="col-md-4 col-lg-3 mb-4">
                <img src="https://via.placeholder.com/500x750?text=Loading..." id="moviePoster" alt="Poster" class="detail-poster">
            </div>

            <div class="col-md-8 col-lg-9 mb-4">
                <div class="info-card">
                    <div class="d-flex align-items-center mb-3">
                        <h1 class="movie-title me-3" id="movieTitle">Đang tải...</h1>
                        <span class="rating-badge"><i class="bi bi-star-fill text-warning"></i> <span id="movieRating">0.0</span></span>
                    </div>

                    <div class="d-flex flex-wrap gap-4 mb-4 meta-text">
                        <span><i class="bi bi-calendar3"></i> <span id="movieYear">...</span></span>
                        <span><i class="bi bi-clock"></i> <span id="movieRuntime">...</span></span>
                        <span class="text-white border border-secondary px-2 rounded-1" style="font-size: 0.8rem; padding-top: 2px;" id="movieGenre">...</span>
                        <span><i class="bi bi-person"></i> <span id="movieDirector">...</span></span>
                    </div>

                    <h5 class="text-white fw-bold mb-2">Overview</h5>
                    <p style="color: #bbb; line-height: 1.6; font-size: 0.95rem;" class="mb-4" id="movieOverview">
                        Đang tải mô tả bộ phim...
                    </p>

                    <h5 class="text-white fw-bold mb-2">Cast</h5>
                    <div class="mb-4" id="movieCast">
                        <span class="cast-pill">Đang tải...</span>
                    </div>
                    <button class="btn-favorite" id="btnFavorite">
                        <i class="bi bi-heart me-2" id="favIcon"></i>
                        <span id="favText">Add to Favorites</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="row mt-2 gx-4">
            <div class="col-md-4 mb-3">
                <div class="stat-card">
                    <div class="stat-value" id="statRating">0.0</div>
                    <div class="stat-label">IMDb Rating</div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="stat-card">
                    <div class="stat-value" id="statYear">...</div>
                    <div class="stat-label">Release Year</div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="stat-card">
                    <div class="stat-value" id="statGenreText" style="font-size: 1.2rem; display: flex; align-items: center; justify-content: center; height: 36px;">...</div>
                    <div class="stat-label">Genre</div>
                </div>
            </div>
        </div>
    </div>

    <script src="movie-detail.js"></script>

</body>
</html>

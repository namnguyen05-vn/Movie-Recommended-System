<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Cinema - Xem phim thông minh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #141414; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #e50914; }
        .navbar-brand { font-weight: bold; font-size: 1.5rem; color: white !important; }
        .auth-container { background-color: #000000a0; padding: 30px; border-radius: 10px; max-width: 400px; margin: 50px auto; border: 1px solid #333; }
        .movie-card { background-color: #2f2f2f; border-radius: 8px; padding: 15px; height: 100%; transition: transform 0.2s; }
        .movie-card:hover { transform: scale(1.05); border: 1px solid #e50914; }
        .movie-title { font-size: 1.1rem; font-weight: bold; color: #fff; margin-bottom: 10px;}
        .movie-genres { font-size: 0.85rem; color: #aaa; margin-bottom: 10px;}
        .rating-badge { background-color: #f5c518; color: black; font-weight: bold; padding: 3px 8px; border-radius: 4px; font-size: 0.9rem;}
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">🎬 AI Cinema</a>
            <div class="d-flex hidden" id="userMenu">
                <span class="navbar-text text-white me-3" id="welcomeText">Xin chào!</span>
                <button class="btn btn-dark btn-sm" onclick="logout()">Đăng xuất</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="authSection" class="auth-container">
            <h4 class="text-center mb-4" id="authTitle">Đăng Nhập</h4>
            <div id="authAlert" class="alert alert-danger hidden" role="alert"></div>

            <form id="authForm">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" id="usernameInput" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" id="passwordInput" required>
                </div>
                <button type="submit" class="btn btn-danger w-100" id="authBtn">Đăng Nhập</button>
            </form>

            <div class="text-center mt-3">
                <a href="#" class="text-secondary" id="toggleAuthMode">Chưa có tài khoản? Đăng ký ngay</a>
            </div>
        </div>

        <div id="mainSection" class="hidden">
            <div id="statusMessage" class="alert alert-info" role="alert">⏳ Đang nhờ AI phân tích dữ liệu...</div>

            <h3 class="mt-4 mb-3 border-start border-danger border-4 ps-2" id="recTitle">Phim Dành Riêng Cho Bạn</h3>
            <div class="row" id="recommendationList"></div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api";
        let isLoginMode = true;

        // Các thành phần giao diện
        const authSection = document.getElementById('authSection');
        const mainSection = document.getElementById('mainSection');
        const userMenu = document.getElementById('userMenu');
        const authForm = document.getElementById('authForm');

        // Kiểm tra xem đã đăng nhập chưa khi vừa mở web
        window.onload = () => {
            const token = localStorage.getItem("token");
            if (token) {
                showMainScreen();
                fetchRecommendations(token);
            }
        };

        // Chuyển đổi giữa Đăng nhập và Đăng ký
        document.getElementById('toggleAuthMode').addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "Đăng Nhập" : "Đăng Ký";
            document.getElementById('authBtn').innerText = isLoginMode ? "Đăng Nhập" : "Tạo Tài Khoản";
            e.target.innerText = isLoginMode ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
            document.getElementById('authAlert').classList.add('hidden');
        });

        // Xử lý khi bấm nút Submit form
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value;
            const password = document.getElementById('passwordInput').value;
            const endpoint = isLoginMode ? "/auth/login" : "/auth/register";

            try {
                const response = await fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert(data.detail || "Có lỗi xảy ra, vui lòng thử lại!");
                    return;
                }

                if (isLoginMode) {
                    // Đăng nhập thành công -> Lưu Token và load phim
                    localStorage.setItem("token", data.access_token);
                    localStorage.setItem("username", username);
                    showMainScreen();
                    fetchRecommendations(data.access_token);
                } else {
                    // Đăng ký thành công -> Bắt đăng nhập lại
                    showAlert("Đăng ký thành công! Vui lòng đăng nhập.", "success");
                    document.getElementById('toggleAuthMode').click(); // Chuyển về form Login
                }
            } catch (error) {
                showAlert("Không thể kết nối đến Máy chủ Backend!");
            }
        });

        // Hàm gọi API Gợi ý AI (Đính kèm Token)
        async function fetchRecommendations(token) {
            try {
                // QUAN TRỌNG: Gắn chữ Bearer và Token vào Header
                const response = await fetch(API_URL + "/recommend", {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.status === 401) {
                    logout(); // Token hết hạn thì tự động đăng xuất
                    return;
                }

                const data = await response.json();
                renderMovies(data);

            } catch (error) {
                document.getElementById('statusMessage').innerText = "❌ Lỗi tải dữ liệu AI!";
                document.getElementById('statusMessage').className = "alert alert-danger";
            }
        }

        // Vẽ danh sách phim ra màn hình
        function renderMovies(data) {
            const statusDiv = document.getElementById('statusMessage');
            const recTitle = document.getElementById('recTitle');
            const recList = document.getElementById('recommendationList');

            if (data.is_new_user) {
                statusDiv.innerText = "👋 Xin chào người dùng mới! Hãy xem các phim thịnh hành dưới đây.";
                statusDiv.className = "alert alert-warning";
                recTitle.innerText = "🔥 Top 5 Phim Thịnh Hành Nhất";
            } else {
                statusDiv.innerText = "✅ Phân tích thành công sở thích của bạn!";
                statusDiv.className = "alert alert-success";
                recTitle.innerText = "✨ Phim AI Dự Đoán Bạn Sẽ Thích";
            }

            let html = '';
            data.recommendations.forEach(movie => {
                html += `
                    <div class="col-md-2 col-sm-4 mb-4">
                        <div class="movie-card">
                            <div class="movie-title">${movie.title}</div>
                            <div class="movie-genres">${movie.genres.replace(/\|/g, ', ')}</div>
                            <span class="rating-badge">⭐ ${movie.predicted_rating}</span>
                        </div>
                    </div>
                `;
            });
            recList.innerHTML = html;
        }

        // Hàm hỗ trợ giao diện
        function showMainScreen() {
            authSection.classList.add('hidden');
            mainSection.classList.remove('hidden');
            userMenu.classList.remove('hidden');
            document.getElementById('welcomeText').innerText = "Xin chào, " + localStorage.getItem("username");
        }

        function showAlert(message, type="danger") {
            const alert = document.getElementById('authAlert');
            alert.innerText = message;
            alert.className = `alert alert-${type}`;
            alert.classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("username");
            location.reload(); // Tải lại trang web
        }
    </script>
</body>
</html>

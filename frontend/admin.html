<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - NEXUS Movies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Sidebar Styles */
        .sidebar {
            height: 100vh; width: 250px; position: fixed; top: 0; left: 0;
            background-color: #1a1a1a; border-right: 1px solid #2a2a2a; padding-top: 20px;
        }
        .sidebar-brand { font-size: 1.5rem; font-weight: 800; color: #fff; padding: 0 20px 20px; border-bottom: 1px solid #2a2a2a; margin-bottom: 20px; }
        .sidebar-brand span { background-color: #e50914; padding: 2px 8px; border-radius: 4px; }
        .nav-link { color: #aaa; padding: 12px 20px; font-weight: 600; transition: all 0.2s; }
        .nav-link:hover, .nav-link.active { color: #fff; background-color: #2a2a2a; border-left: 4px solid #e50914; }
        .nav-link i { margin-right: 10px; width: 20px; text-align: center; }

        /* Main Content */
        .main-content { margin-left: 250px; padding: 30px; }

        /* Stat Cards */
        .stat-card {
            background-color: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px;
            padding: 24px; display: flex; align-items: center; justify-content: space-between;
        }
        .stat-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .stat-info h3 { font-size: 2rem; font-weight: 700; margin: 0; }
        .stat-info p { color: #aaa; margin: 0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand"><span>NEXUS</span> Admin</div>
        <div class="nav flex-column">
            <a href="#" class="nav-link active"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
            <a href="#" class="nav-link"><i class="bi bi-film"></i> Quản lý Phim</a>
            <a href="#" class="nav-link"><i class="bi bi-people-fill"></i> Quản lý Users</a>
            <a href="index.html" class="nav-link mt-5 text-warning"><i class="bi bi-box-arrow-left"></i> Về Trang chủ</a>
        </div>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Tổng quan Hệ thống</h2>

            <button id="retrainAIBtn" class="btn btn-warning fw-bold shadow">
                <i class="bi bi-cpu-fill me-2"></i>Cập nhật Model AI
            </button>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-info">
                        <p>Tổng số Phim</p>
                        <h3 id="totalMovies">--</h3>
                    </div>
                    <div class="stat-icon bg-primary text-white"><i class="bi bi-film"></i></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-info">
                        <p>Thành viên</p>
                        <h3 id="totalUsers">--</h3>
                    </div>
                    <div class="stat-icon bg-success text-white"><i class="bi bi-people"></i></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-info">
                        <p>Lượt Đánh giá</p>
                        <h3 id="totalRatings">--</h3>
                    </div>
                    <div class="stat-icon bg-warning text-dark"><i class="bi bi-star-fill"></i></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-info">
                        <p>AI Last Update</p>
                        <h3 id="aiLastUpdate" class="fs-5 mt-2">Đang tải...</h3>
                    </div>
                    <div class="stat-icon bg-danger text-white"><i class="bi bi-clock-history"></i></div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="stat-card d-block" style="height: 400px;">
                    <h5 class="fw-bold mb-4 border-bottom border-secondary pb-2">Top Phim Yêu Thích</h5>
                    <div class="text-center text-secondary mt-5 pt-5">
                        <div class="spinner-border mb-3"></div>
                        <p>Đang tải dữ liệu xếp hạng...</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="stat-card d-block" style="height: 400px;">
                    <h5 class="fw-bold mb-4 border-bottom border-secondary pb-2">Top Phim Đánh Giá Cao</h5>
                    <div class="text-center text-secondary mt-5 pt-5">
                        <div class="spinner-border mb-3"></div>
                        <p>Đang tải dữ liệu đánh giá...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/api";

        document.addEventListener('DOMContentLoaded', () => {
            const role = localStorage.getItem('role');
            const token = localStorage.getItem('token');
            if (!token || role !== 'admin') { /*... code chặn ...*/ return; }

            // Tải toàn bộ dữ liệu khi vào trang
            loadDashboardStats(token);
            loadTopFavorites(token);
            loadTopRated(token);
        });

        // HÀM 1: Tải Top Phim Yêu Thích
        async function loadTopFavorites(token) {
            const container = document.querySelector('.col-md-6:nth-child(1) .text-center');
            try {
                const response = await fetch(`${API_URL}/admin/top-favorites`, { headers: { 'Authorization': 'Bearer ' + token }});
                if (response.ok) {
                    const data = await response.json();
                    let html = '<table class="table table-dark table-hover text-start mt-3"><tbody>';
                    data.forEach((item, index) => {
                        html += `<tr><td style="width: 10%"><span class="badge bg-danger">${index + 1}</span></td>
                                 <td>${item.title}</td>
                                 <td class="text-end text-danger"><i class="bi bi-heart-fill me-1"></i>${item.count}</td></tr>`;
                    });
                    html += '</tbody></table>';
                    container.innerHTML = html;
                }
            } catch (error) { container.innerHTML = '<span class="text-danger">Lỗi tải dữ liệu</span>'; }
        }

        // HÀM 2: Tải Top Phim Đánh Giá Cao
        async function loadTopRated(token) {
            const container = document.querySelector('.col-md-6:nth-child(2) .text-center');
            try {
                const response = await fetch(`${API_URL}/admin/top-rated`, { headers: { 'Authorization': 'Bearer ' + token }});
                if (response.ok) {
                    const data = await response.json();
                    let html = '<table class="table table-dark table-hover text-start mt-3"><tbody>';
                    data.forEach((item, index) => {
                        html += `<tr><td style="width: 10%"><span class="badge bg-warning text-dark">${index + 1}</span></td>
                                 <td>${item.title}</td>
                                 <td class="text-end text-warning"><i class="bi bi-star-fill me-1"></i>${item.rating}</td></tr>`;
                    });
                    html += '</tbody></table>';
                    container.innerHTML = html;
                }
            } catch (error) { container.innerHTML = '<span class="text-danger">Lỗi tải dữ liệu</span>'; }
        }

        // HÀM 3: Lắng nghe sự kiện Bấm nút Cập nhật AI
        document.getElementById('retrainAIBtn').addEventListener('click', async function() {
            const token = localStorage.getItem('token');
            const btn = this;

            // Đổi giao diện nút thành Loading
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang phân tích dữ liệu...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/admin/retrain-ai`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.ok) {
                    const data = await response.json();
                    alert(data.message); // Báo thành công
                    document.getElementById('aiLastUpdate').innerText = data.last_update; // Cập nhật giờ trên ô chỉ số
                } else {
                    alert("Có lỗi xảy ra khi huấn luyện AI.");
                }
            } catch (error) {
                alert("Lỗi kết nối máy chủ!");
            } finally {
                // Trả lại nút như cũ
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
